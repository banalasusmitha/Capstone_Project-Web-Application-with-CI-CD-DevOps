apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 968313778667.dkr.ecr.ap-south-1.amazonaws.com/avinash-shopnow/backend:v1
          ports:
            - containerPort: 5000
