apiVersion: apps/v1
kind: Deployment

metadata:
  name: admin-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
        - name: admin
          image: 968313778667.dkr.ecr.ap-south-1.amazonaws.com/avinash-shopnow/admin:v1
          ports:
            - containerPort: 80
