apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnow-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /avinash
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /avinash-admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 80
