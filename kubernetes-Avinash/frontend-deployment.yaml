apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 968313778667.dkr.ecr.ap-south-1.amazonaws.com/avinash-shopnow/frontend:v1
          ports:
            - containerPort: 80
